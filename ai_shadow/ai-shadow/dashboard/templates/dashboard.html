<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Shadow Dashboard</title>
    <link rel="stylesheet" href="/static/styles.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="/static/dashboard.js"></script>
</head>
<body>
    <div class="dashboard-container">
        <header class="dashboard-header">
            <h1>AI Shadow Dashboard</h1>
            <div class="header-controls">
                <select class="timeframe-select">
                    <option value="day">Last 24 Hours</option>
                    <option value="week">Last Week</option>
                    <option value="month">Last Month</option>
                    <option value="year">Last Year</option>
                </select>
                <button class="refresh-btn">Refresh Data</button>
            </div>
        </header>

        <main class="dashboard-content">
            <section class="growth-section">
                <h2>Personal Growth Metrics</h2>
                <div class="growth-summary"></div>
                <div class="growth-chart-container">
                    <canvas id="growth-charts"></canvas>
                </div>
                <div class="recommendations"></div>
            </section>

            <section class="opportunities-section">
                <h2>Engagement Opportunities</h2>
                <div class="opportunities-filters">
                    <div class="filter-group">
                        <label>Platform:</label>
                        <select class="platform-filter">
                            <option value="all">All Platforms</option>
                            <option value="twitter">Twitter</option>
                            <option value="linkedin">LinkedIn</option>
                            <option value="reddit">Reddit</option>
                            <option value="instagram">Instagram</option>
                        </select>
                    </div>
                    <div class="filter-group">
                        <label>Category:</label>
                        <select class="category-filter">
                            <option value="all">All Categories</option>
                            <option value="tech">Technology</option>
                            <option value="growth">Personal Growth</option>
                            <option value="spirituality">Spirituality</option>
                            <option value="business">Business</option>
                        </select>
                    </div>
                </div>
                <div id="opportunities-list" class="opportunities-grid"></div>
            </section>

            <section class="activity-section">
                <h2>Recent Activity</h2>
                <div id="activity-list" class="activity-feed"></div>
            </section>
        </main>

        <aside class="dashboard-sidebar">
            <section class="profile-section">
                <h3>Shadow Profile</h3>
                <div class="profile-stats">
                    <div class="stat">
                        <label>Growth Score</label>
                        <span class="value" id="growth-score">0.0</span>
                    </div>
                    <div class="stat">
                        <label>Active Platforms</label>
                        <span class="value" id="active-platforms">0</span>
                    </div>
                    <div class="stat">
                        <label>Engagement Rate</label>
                        <span class="value" id="engagement-rate">0%</span>
                    </div>
                </div>
            </section>

            <section class="insights-section">
                <h3>Key Insights</h3>
                <div id="insights-list"></div>
            </section>

            <section class="actions-section">
                <h3>Recommended Actions</h3>
                <div id="actions-list"></div>
            </section>
        </aside>
    </div>
</body>
</html>
